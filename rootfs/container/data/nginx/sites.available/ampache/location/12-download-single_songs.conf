rewrite ^/play/ssid/(.*)/type/(.*)/oid/([0-9]+)/uid/([0-9]+)/action/(.*)/name/(.*)$ /play/index.php?ssid=$1&type=$2&oid=$3&uid=$4&action=$5&name=$6 last;
location /play {
    if (!-e $request_filename) {
        rewrite ^/play/art/([^/]+)/user/([0-9]+)/thumb([0-9]*)\.([a-z]+)$ /image.php?action=show_user_avatar&object_id=$2&auth=$1&thumb=$3 last;
        rewrite ^/play/art/([^/]+)/user/([0-9]+)/size([0-9]+x[0-9]+)\.([a-z]+)$ /image.php?action=show_user_avatar&object_id=$2&auth=$1&size=$3 last;
        rewrite ^/play/art/([^/]+)/([^/]+)/([0-9]+)/thumb([0-9]*)\.([a-z]+)$ /image.php?object_type=$2&object_id=$3&auth=$1&thumb=$4&name=art.jpg last;
        rewrite ^/play/art/([^/]+)/([^/]+)/([0-9]+)/size([0-9]+x[0-9]+)\.([a-z]+)$ /image.php?object_type=$2&object_id=$3&auth=$1&size=$4&name=art.jpg last;
    }

    # Generic fallback for any beautiful play URL. Ampache builds play URLs generically
    # (Stream_Url::format) and parses QUERY_STRING generically in PlayAction, so hardcoded
    # rewrites can never cover every combination (e.g. .../bitrate/N/cache/1/player/... from DSub).
    # Passing the tail through as the query string lets PlayAction split it into key/value pairs.
    # The negative lookahead avoids rewriting /play/index.php itself into a loop.
    rewrite ^/play/(?!index\.php)(.*)$ /play/index.php?$1 last;
    break;
}