location /rest {
    limit_except GET POST {
        deny all;
    }
    # Rewrite rule for Subsonic backend
    if ( !-e $request_filename ) {
        rewrite ^/rest/fake/(.+)$ /play/$1 last;
        rewrite ^/rest/(.*).view$ /rest/index.php?ssaction=$1;
        rewrite ^/rest/(.*)$ /rest/index.php?ssaction=$1;
    }
}